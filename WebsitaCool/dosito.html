<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inglés Básico</title>
    <link rel="stylesheet" href="disenio2.css">
</head>

<body>

    <h1>Inglés Básico</h1>

    <p>
        En esta página aprenderemos algunos temas básicos del idioma inglés,
        como el verbo <strong>To Be</strong>, los pronombres personales,
        vocabulario y expresiones sencillas.
    </p>

    <form action="tresito.html" method="get">

        <h2>WELCOME!</h2>

        <label for="nombre">Nombre:</label>
        <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Escribe tu nombre"
            required
        >

        <br><br>

        <label for="edad">Edad:</label>
        <input
            type="number"
            id="edad"
            name="edad"
            placeholder="Escribe tu edad"
            min="1"
            required
        >

        <br><br>

        <label for="nivel">Nivel de inglés:</label>

        <select id="nivel" name="nivel" required>
            <option value="">Selecciona tu nivel</option>
            <option value="alto">Alto</option>
            <option value="medio">Medio</option>
            <option value="nulo">Nulo</option>
        </select>

        <br><br>

        <button type="submit">¡Comenzar! →</button>

    </form>

    <br>

    <a href="index.html">← Regresar a la página principal</a>

</body>

</html>
